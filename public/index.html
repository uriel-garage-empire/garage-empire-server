function buyUp(k){const o=cur();if(!o)return;const costs={tu:TU_COST,ti:TI_COST,wt:WT_COST}[k],cst=costs[o.up[k]];if(cst===undefined)return;if(S.usd<cst)return toast(t('poor'));S.usd-=cst;o.up[k]++;S.sel=o.id;render()}
function vParts(){const o=cur();if(!o)return`<div class="card">${t('pick')}</div>`;const c=CARS[o.cid];
 const kits=[t('kitEng'),t('kitTir'),t('kitBrk')];
 const ups=[['tu',t('turbo'),TU_COST,3],['ti',t('tiresUp'),TI_COST,2],['wt',t('weightUp'),WT_COST,2]];
 return`<div class="card"><h2>${c[0]} <span class="mut">${c[1]}</span></h2><p class="mut">${t('estNote')}</p>
 <div class="eyebrow" style="margin:8px 0">${t('oem')}</div>`+
 kits.map((n,i)=>`<div class="row" style="margin:6px 0"><span>${n} <span class="mut">(${o.w[i]}%)</span></span><button onclick="buyKit(${i})" ${o.w[i]>=100?'disabled':''}>${o.w[i]>=100?t('ok'):t('install')+' '+fmt(kitCost(o,i))}</button></div>`).join('')+
 `<div class="eyebrow" style="margin:10px 0">${t('after')}</div>`+
 ups.map(([k,n,costs,mx])=>`<div class="row" style="margin:6px 0"><span>${n} <span class="mut">${t('stage')} ${o.up[k]}/${mx}</span></span><button onclick="buyUp('${k}')" ${o.up[k]>=mx?'disabled':''}>${o.up[k]>=mx?t('maxed'):t('install')+' '+fmt(costs[o.up[k]])}</button></div>`).join('')+
 `<div class="row" style="margin:6px 0"><span>${t('tune')} <span class="mut">${t('stage')} ${o.st}/3</span></span><button onclick="tune(${o.id})" ${o.st>=3?'disabled':''}>${o.st>=3?t('maxed'):t('install')+' '+fmt(ECU_STEP*(o.st+1))}</button></div>
 <div class="row" style="margin:6px 0"><span>${t('spoiler')}</span><button onclick="spoil(${o.id})">${o.sp?t('installed'):t('install')+' '+fmt(SPOILER_COST)}</button></div></div>`}

function hire(m){const d=TEAMDEF.find(x=>x[0]===m);if(!d||has(m))return;if(S.usd<d[1])return toast(t('poor'));S.usd-=d[1];S.team.push(m);render()}
function vTeam(){return`<div class="teamGrid">`+TEAMDEF.map(([id,cost,nk,dk])=>`<div class="card teamCard"><div class="row"><b>${t(nk)}</b>${has(id)?`<span class="tag" style="background:var(--good)">${t('hired')}</span>`:`<button class="pri" onclick="hire('${id}')">${t('hire')} ${fmt(cost)}</button>`}</div><div class="mut" style="margin-top:4px">${t(dk)}</div></div>`).join('')+`</div>`}

function spoil(id){const o=S.own.find(x=>x.id===id);S.sel=id;if(o.sp){if(!confirm(word('Remove the spoiler? No refund.','تشيل السبويلر؟ مش هترجع فلوسه.')))return;o.sp=0}else{if(S.usd<SPOILER_COST)return toast(t('poor'));S.usd-=SPOILER_COST;o.sp=1}render()}

function sell(id){const o=S.own.find(x=>x.id===id);S.usd+=Math.round(val(o));S.own=S.own.filter(x=>x.id!==id);if(S.sel===id)S.sel=S.own[0]?S.own[0].id:0;toast(t('sold'));render()}
function buy(i){const s=S.stock[i];if(S.own.length>=8)return toast(t('full'));if(S.usd<s.price)return toast(t('poor'));
 S.usd-=s.price;const w=()=>Math.max(10,Math.min(100,s.cond+Math.round(rnd(-12,12))));
 const o={id:uid++,cid:s.cid,w:[w(),w(),w()],col:COLS[Math.floor(rnd(0,COLS.length))],sp:0,st:0,up:{tu:0,ti:0,wt:0}};S.own.push(o);S.sel=o.id;S.stock.splice(i,1);toast(t('bought'));render()}
function repair(id,i){const o=S.own.find(x=>x.id===id),c=rcost(o,i);if(S.usd<c)return toast(t('poor'));S.usd-=c;o.w[i]=100;render()}
function repairAll(){const o=cur(),c=[0,1,2].reduce((a,i)=>a+rcost(o,i),0);if(S.usd<c)return toast(t('poor'));S.usd-=c;o.w=[100,100,100];render()}
let racing=false,R=null,greenAt=0,launched=false,timers=[],resolved=true,rTotal=0,pTotal=null,lastReact=0,rReactMs=0,pRun=0,rEt0=0,gear=0,gearStart=0,limiterAt=0,shifts=[],rpmId=0;
const GEARS=4;
const has=m=>S.team&&S.team.includes(m);
const isEV=o=>shapeOf(o.cid)==='ev';
const zone=()=>has('coach')?[72,93]:[76,90];
function shiftKind(p){const[a,b]=zone();if(p>=a&&p<=b)return'perfect';if(p>=55&&p<=97)return'goodS';return p<55?'earlyS':'lateS'}
function shiftDelta(p){const[a,b]=zone();if(p>=a&&p<=b)return-.15;if(p>=55&&p<=97)return 0;if(p<55)return .18;return .25}
function scout(){if(racing)return;const o=cur();if(!o)return toast(t('pick'));
 const tr=tier(),pool=CARS.map((c,i)=>({c,i})).filter(x=>x.c[2]===tr);
 const sel=pool.length?pool[Math.floor(Math.random()*pool.length)]:{c:CARS[0],i:0};
 const wv=()=>Math.round(rnd(50,100));
 R={id:0,cid:sel.i,w:[wv(),wv(),wv()],col:'#1c1c1e',sp:tr>=3?1:0,st:Math.min(3,Math.floor(tr/2)),up:{tu:tr>=4?1:0,ti:0,wt:0}};render()}
const rEt=()=>et(R);
function animate(el,secs){if(!el)return;el.style.transition='none';el.style.width='0';void el.offsetWidth;el.style.transition=`width ${secs}s linear`;el.style.width='100%'}
function animateSeg(el,secs,toPct){if(!el)return;el.style.transition=`width ${secs}s linear`;el.style.width=toPct+'%'}
function race(){
 if(racing)return;const o=cur();if(!o)return toast(t('pick'));if(!R)return scout();
 racing=true;launched=false;resolved=false;pTotal=null;shifts=[];gear=0;limiterAt=0;greenAt=0;render();
 const token=raceToken,k=.3,lights=[...document.querySelectorAll('#tree i')];
 timers.forEach(clearTimeout);timers=[];
 lights.forEach((el,i)=>timers.push(setTimeout(()=>{if(token===raceToken)el.classList.add('on')},500*(i+1))));
 const waitMs=500*lights.length+rnd(500,1400);
 pRun=et(o)*rnd(.98,1.03);
 rEt0=rEt();
 const rReact=rnd(Math.max(120,330-30*tier()),Math.max(190,430-35*tier()));
 rReactMs=Math.round(rReact);
 rTotal=rReact/1000+rEt0*rnd(.97,1.05);
 timers.push(setTimeout(()=>{if(token!==raceToken)return;greenAt=performance.now();try{localStorage.setItem('garage-empire-race-pending',JSON.stringify({id:o.id}))}catch{}
  lights.forEach(el=>el.className='');lights[lights.length-1].className='go';
  const b=document.getElementById('go');if(b)b.textContent=t('tapGo');
  timers.push(setTimeout(()=>{if(token===raceToken)animate(document.getElementById('l2'),(rTotal-rReact/1000)*k)},rReact));
  timers.push(setTimeout(()=>{if(token===raceToken&&!launched)resolve(token,o)},rTotal*k*1000+400));
 },waitMs));
}
function launch(){
 if(!racing||resolved)return;const o=cur(),token=raceToken,k=.3;
 if(!greenAt){timers.forEach(clearTimeout);timers=[];pTotal=-1;return resolve(token,o)}
 if(launched)return;launched=true;
 const react=performance.now()-greenAt;lastReact=Math.round(react);
 const b=document.getElementById('go'),wrap=document.getElementById('rpmWrap'),gn=document.getElementById('gearNum');
 if(wrap)wrap.hidden=false;
 if(isEV(o)){
  pTotal=react/1000+pRun;
  if(b)b.textContent=t('auto');
  if(gn)gn.textContent=t('auto');
  animate(document.getElementById('l1'),pRun*k);
  timers.push(setTimeout(()=>resolve(token,o),Math.max(pTotal,rTotal)*k*1000+300));
  return;
 }
 gear=1;gearStart=performance.now();
 if(b)b.textContent=t('shift');
 if(gn)gn.textContent=gear+' / '+GEARS;
 const gearDurMs=k*pRun/GEARS*1000;
 animateSeg(document.getElementById('l1'),gearDurMs/1000,gear/GEARS*100);
 rpmId=requestAnimationFrame(()=>rpmTick(token,o,gearDurMs));
}
function rpmTick(token,o,gearDurMs){
 if(token!==raceToken||resolved)return;
 const el=document.getElementById('rpmFill');
 const pct=(performance.now()-gearStart)/gearDurMs*100;
 if(el)el.style.width=Math.min(100,pct)+'%';
 if(pct>=100){
  if(gear<GEARS){
   if(!limiterAt)limiterAt=performance.now();
   if(performance.now()-limiterAt>300){doShift(100,token,o,gearDurMs);return}
  }else{finishRun(token,o);return}
 }
 rpmId=requestAnimationFrame(()=>rpmTick(token,o,gearDurMs));
}
function shift(){
 if(!racing||resolved||!launched||gear<1||gear>=GEARS)return;
 const o=cur(),token=raceToken,k=.3,gearDurMs=k*pRun/GEARS*1000;
 const pct=Math.min(100,(performance.now()-gearStart)/gearDurMs*100);
 doShift(pct,token,o,gearDurMs);
}
function doShift(pct,token,o,gearDurMs){
 if(resolved||gear<1||gear>=GEARS)return;
 const kind=shiftKind(pct);
 shifts.push({kind,delta:shiftDelta(pct)});
 const log=document.getElementById('shiftLog');
 if(log){const s=document.createElement('span');s.className=kind;s.textContent=t(kind);log.appendChild(s)}
 gear++;gearStart=performance.now();limiterAt=0;
 const gn=document.getElementById('gearNum');if(gn)gn.textContent=gear+' / '+GEARS;
 const el=document.getElementById('rpmFill');if(el)el.style.width='0';
 animateSeg(document.getElementById('l1'),gearDurMs/1000,gear/GEARS*100);
 cancelAnimationFrame(rpmId);
 rpmId=requestAnimationFrame(()=>rpmTick(token,o,gearDurMs));
}
function finishRun(token,o){
 if(resolved||token!==raceToken)return;
 cancelAnimationFrame(rpmId);
 const k=.3,delta=shifts.reduce((a,s)=>a+s.delta,0);
 pTotal=lastReact/1000+pRun+delta;
 animateSeg(document.getElementById('l1'),.15,100);
 timers.push(setTimeout(()=>resolve(token,o),Math.max(300,(rTotal-pTotal)*k*1000+300)));
}
function report(o,won){
 const pET=et(o),rE=rEt0;
 const loss=shifts.filter(s=>s.delta>0).reduce((a,s)=>a+s.delta,0);
 const gain=-shifts.filter(s=>s.delta<0).reduce((a,s)=>a+s.delta,0);
 const rows=[`${t('vsReact')}: ${word('you','انت')} ${lastReact}ms / ${word('the rival','المنافس')} ${rReactMs}ms`,
  `${t('vsEt')}: ${word('you','انت')} ${pET.toFixed(2)}s / ${word('the rival','المنافس')} ${rE.toFixed(2)}s`,
  `${t('vsShift')}: ${shifts.length?(loss?loss.toFixed(2)+'s':(gain?'+ '+gain.toFixed(2)+'s':'0')):t('auto')}`];
 const tips=[];
 if(lastReact-rReactMs>80)tips.push(t('tipReaction'));
 if(pET-rE>0.15)tips.push(t('tipBuild'));
 if(cond(o)<75)tips.push(t('tipCond'));
 if(loss>0.2)tips.push(t('tipShifts'));
 if(!tips.length)tips.push(t('tipGood'));
 return`<div class="repBox"><b>📋 ${t('report')}</b><ul>${rows.map(r=>`<li>${r}</li>`).join('')}${tips.map(x=>`<li class="tip">${x}</li>`).join('')}</ul></div>`;
}
function resolve(token,o){
 if(resolved||token!==raceToken)return;resolved=true;racing=false;try{localStorage.removeItem('garage-empire-race-pending')}catch{}
 cancelAnimationFrame(rpmId);
 const words=L[S.lang],rc=CARS[R.cid],fs=pTotal===-1,tb=tier(),prize=prizeOf();
 const won=!fs&&pTotal!==null&&pTotal<rTotal;
 const rep=fs||pTotal===null||!has('analyst')?'':report(o,won);
 if(won){S.usd+=prize;S.wins++;if(tier()>tb){R=null;toast(t('tierUp'))}}
 if(!fs){const wf=has('mechanic')?.8:1;o.w=o.w.map((v,i)=>Math.max(5,v-Math.round(rnd(3,i===1?14:9)*wf)))}
 render();
 const output=document.getElementById('res');
 if(output){output.style.color=won?'var(--good)':'var(--bad)';
  output.innerHTML=(fs?words.fs:`${won?words.win:words.lose}${!launched?' · '+words.dnf:''} · ${words.you} ${pTotal===null?'--':pTotal.toFixed(2)+'s'} / ${words.opp} ${rTotal.toFixed(2)}s (${rc[0]})`+(launched?` · ${words.react} ${lastReact}ms`:'')+(won?` · ${words.prize} ${fmt(prize)}`:''))+(rep||'')}
}

for(const fn of ['paint','spoil','tune','sell','buy','repair','repairAll','buyKit','buyUp','hire']){const original=window[fn];window[fn]=function(...args){if(racing)return toast(word('Finish the race first','استنى السباق يخلص'));return original(...args)}}

/* bidi-fix1: isolate Latin/number runs inside Arabic text */
(function(){
const RUN=/[A-Za-z0-9$€£(][A-Za-z0-9$€£%+.,:\/'’°×·()\-\u00a0 ]*[A-Za-z0-9$€£%)]|[A-Za-z0-9$€£]/g;
const HAS_AR=/[\u0600-\u06FF]/;
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','OPTION','SELECT','CANVAS','NOSCRIPT']);
let busy=false,mo;
function skipEl(el){for(;el&&el!==document.body;el=el.parentElement){if(SKIP.has(el.tagName)||el.classList?.contains('ltrRun')||el.getAttribute('dir')==='ltr')return true}return false}
function fix(root){
 if(document.documentElement.dir!=='rtl')return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];
 for(let n;n=w.nextNode();){if(HAS_AR.test(n.nodeValue)&&/[A-Za-z0-9]/.test(n.nodeValue)&&!skipEl(n.parentElement))list.push(n)}
 for(const n of list){
  const t=n.nodeValue,f=document.createDocumentFragment();let last=0,m;RUN.lastIndex=0;
  while((m=RUN.exec(t))){
   if(m.index>last)f.append(t.slice(last,m.index));
   let run=m[0],trail='';const mt=run.match(/[ \u00a0]+$/);if(mt){trail=mt[0];run=run.slice(0,-trail.length)}
   const sp=document.createElement('span');sp.className='ltrRun';sp.textContent=run;f.append(sp);if(trail)f.append(trail);last=m.index+m[0].length}
  if(last<t.length)f.append(t.slice(last));
  n.replaceWith(f)}
}
function run(){busy=true;try{fix(document.body)}finally{busy=false}}
mo=new MutationObserver(()=>{if(busy)return;busy=true;try{fix(document.body)}finally{busy=false}});
mo.observe(document.body,{childList:true,subtree:true,characterData:true});
run();
})();
